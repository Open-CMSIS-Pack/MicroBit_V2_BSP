name: Build pack

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Generate pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cmsis-knowledge 0.1.0 from https://github.com/MatthiasHertelArm/cmsis-developer-assistant-tools (pinned commit)
      - name: Install the knowledge builder
        run: >-
          python3 -m pip install
          "git+https://github.com/MatthiasHertelArm/cmsis-developer-assistant-tools.git@e1150bd7164d523e5549913caddd68959afd3be7"

      - name: Generate pack
        uses: Open-CMSIS-Pack/gen-pack-action@main
        with:
          doxygen-version: none
          packchk-version: 1.4.1
          gen-pack-script: ./gen_pack.sh
          gen-pack-output: ./output
          gh-pages-branch: ''
          gh-pages-deploy: ''
          pack-artifact-format: pack

      # The pdsc is taken from the generated pack, so the release carries the exact pack description
      - name: Extract the pdsc from the pack
        if: startsWith(github.ref, 'refs/tags/v')
        run: unzip -o output/*.pack 'MicroBit.MicroBit_V2_BSP.pdsc' -d output/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.pack
            output/*.pdsc
          generate_release_notes: true
